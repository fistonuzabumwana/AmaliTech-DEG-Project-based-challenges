name: Deploy Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Get the code from repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js to run tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install dependencies
        working-directory: dev-ops/DeployReady/app
        run: npm install

      # Run tests (pipeline stops if this fails)
      - name: Run tests
        working-directory: dev-ops/DeployReady/app
        run: npm test

      # Login to GitHub Container Registry
      - name: Login to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build Docker image
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/deployready-app:${{ github.sha }} dev-ops/DeployReady

      # Push Docker image
      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/deployready-app:${{ github.sha }}

      # Configure AWS credentials so GitHub Actions can call AWS Systems Manager.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy the new Docker image to EC2 using AWS Systems Manager Run Command.
      - name: Deploy to EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker container" \
            --parameters 'commands=[
              "docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}",
              "docker pull ghcr.io/${{ github.repository_owner }}/deployready-app:${{ github.sha }}",
              "docker stop deployready-app || true",
              "docker rm deployready-app || true",
              "docker run -d --name deployready-app --restart unless-stopped -e PORT=3000 -p 80:3000 ghcr.io/${{ github.repository_owner }}/deployready-app:${{ github.sha }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
