name: Deploy Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Get the code from repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js to run tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install dependencies
        working-directory: dev-ops/DeployReady/app
        run: npm install

      # Run tests (pipeline stops if this fails)
      - name: Run tests
        working-directory: dev-ops/DeployReady/app
        run: npm test

      # Login to GitHub Container Registry
      - name: Login to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build Docker image
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/deployready-app:${{ github.sha }} dev-ops/DeployReady

      # Push Docker image
      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/deployready-app:${{ github.sha }}

      # Configure AWS credentials so GitHub Actions can call AWS Systems Manager.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy the new image with SSM and rollback to the previous image if health check fails.
      - name: Deploy to EC2 using SSM with rollback
        run: |
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -e",
              "NEW_IMAGE=ghcr.io/${{ github.repository_owner }}/deployready-app:${{ github.sha }}",
              "PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' deployready-app 2>/dev/null || true)",
              "echo Previous image: $PREVIOUS_IMAGE",
              "echo New image: $NEW_IMAGE",
              "docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}",
              "docker pull $NEW_IMAGE",
              "docker stop deployready-app || true",
              "docker rm deployready-app || true",
              "docker run -d --name deployready-app --restart unless-stopped -e PORT=3000 -p 80:3000 $NEW_IMAGE",
              "sleep 10",
              "if curl -fsS http://localhost/health; then echo Deployment health check passed; exit 0; fi",
              "echo Deployment health check failed. Rolling back...",
              "docker stop deployready-app || true",
              "docker rm deployready-app || true",
              "if [ -n \"$PREVIOUS_IMAGE\" ]; then docker run -d --name deployready-app --restart unless-stopped -e PORT=3000 -p 80:3000 $PREVIOUS_IMAGE; echo Rolled back to $PREVIOUS_IMAGE; else echo No previous image found for rollback; fi",
              "exit 1"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker container with rollback" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output text
